services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supchat-backend
    ports:
      - "8888:8888"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=8888

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supchat-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:

      - REACT_APP_API_URL=http://192.168.1.111:8888

