version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pg-test
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=SuperSecretPassword2024!
      - POSTGRES_DB=supchat
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d supchat"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  node:
    image: node:18-alpine
    container_name: node-test
    command: >
      sh -c "
        apk add --no-cache postgresql-client &&
        echo 'Attente de PostgreSQL...' &&
        sleep 5 &&
        echo 'Test de connectivité réseau avec ping...' &&
        ping -c 3 postgres &&
        echo 'Test de connexion PostgreSQL avec psql...' &&
        PGPASSWORD=SuperSecretPassword2024! psql -h postgres -U admin -d supchat -c 'SELECT version();'
      "
    depends_on:
      - postgres
