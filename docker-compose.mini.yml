version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: supchat-postgres-mini
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=REDACTED
      - POSTGRES_DB=supchat
    ports:
      - "5432:5432"
    volumes:
      - postgres_mini_data:/var/lib/postgresql/data
    networks:
      - supchat-mini-network

  backend:
    image: node:18-alpine
    container_name: supchat-backend-mini
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - PGUSER=admin
      - PGPASSWORD=REDACTED
      - PGDATABASE=supchat
      - PGHOST=postgres
      - PGPORT=5432
    networks:
      - supchat-mini-network
    depends_on:
      - postgres
    tty: true
    stdin_open: true
    command: >
      sh -c "
        echo 'Installation des dépendances...' &&
        npm install pg &&
        echo 'Attente du démarrage de PostgreSQL...' &&
        sleep 5 &&
        echo 'Test de connexion à PostgreSQL...' &&
        node /app/simple-db-test.cjs
      "

networks:
  supchat-mini-network:
    driver: bridge

volumes:
  postgres_mini_data:
    driver: local
