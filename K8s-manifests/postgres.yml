apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: supchat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_PASSWORD
              value: "root"
            - name: POSTGRES_DB
              value: "test_db"
          volumeMounts:
            - mountPath: /docker-entrypoint-initdb.d
              name: init-sql
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
      volumes:
        - name: init-sql
          configMap:
            name: db-init-configmap
        - name: postgres-storage
          emptyDir: {}
