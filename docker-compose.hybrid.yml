version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: supchat-postgres
    environment:
      POSTGRES_DB: supchat
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: REDACTED
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init-docker.sql:/docker-entrypoint-initdb.d/init-docker.sql:ro
    networks:
      - REDACTED
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U admin -d supchat"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: supchat-redis
    environment:
      - REDIS_PASSWORD=REDACTED
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - REDACTED
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass REDACTED
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "REDACTED", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: supchat-backend
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=supchat
      - DB_USER=admin
      - DB_PASSWORD=REDACTED
      - POSTGRES_DB=supchat
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=REDACTED
      - JWT_SECRET=REDACTED
      - SCW_ENDPOINT=https://s3.fr-par.scw.cloud/
      - SCW_REGION=fr-par
      - S3_BUCKET_NAME=s3-supchat
      - SCW_ACCESS_KEY_ID=REDACTED
      - SCW_SECRET_ACCESS_KEY=REDACTED
      - EMAIL_HOST=mail86.lwspanel.com
      - EMAIL_PORT=465
      - GOOGLE_CALLBACK_URL=http://localhost:3000/api/users/auth/google/callback
      - GITHUB_CALLBACK_URL=http://localhost:3000/api/users/auth/github/callback
      - FRONTEND_URL=http://localhost
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=REDACTED
      - LOG_LEVEL=info
      - LOG_FILE_PATH=REDACTED
      - GOOGLE_CLIENT_ID=REDACTED
      - GOOGLE_CLIENT_SECRET=REDACTED
      - GITHUB_CLIENT_ID=REDACTED
      - GITHUB_CLIENT_SECRET=REDACTED
      - STRAWPOLL_API_KEY=REDACTED
      - MISTRAL_API_KEY=REDACTED
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - REDACTED
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: supchat-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api
      - REACT_APP_SOCKET_URL=http://localhost:3000
    ports:
      - "80:80"
    networks:
      - REDACTED
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: supchat-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@supchat.fr
      PGADMIN_DEFAULT_PASSWORD: REDACTED
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - REDACTED
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  REDACTED:
    driver: bridge
