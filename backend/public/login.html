<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .error {
            color: red;
            margin: 10px 0;
        }
        .toggle-form {
            text-align: center;
            margin-top: 15px;
            cursor: pointer;
            color: blue;
        }
    </style>
</head>
<body>
    <div id="loginForm">
        <h2>Login</h2>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="loginEmail">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="loginPassword">
        </div>
        <div id="loginError" class="error"></div>
        <button onclick="login()">Login</button>
        <div class="toggle-form" onclick="toggleForm()">Need to register?</div>
    </div>

    <div id="registerForm" style="display: none;">
        <h2>Register</h2>
        <div class="form-group">
            <label>Name:</label>
            <input type="text" id="registerName">
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="registerEmail">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="registerPassword">
        </div>
        <div id="registerError" class="error"></div>
        <button onclick="register()">Register</button>
        <div class="toggle-form" onclick="toggleForm()">Already have an account?</div>
    </div>

    <script>
        function toggleForm() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            loginForm.style.display = loginForm.style.display === 'none' ? 'block' : 'none';
            registerForm.style.display = registerForm.style.display === 'none' ? 'block' : 'none';
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const response = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, mot_de_passe: password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('userToken', data.token);
                    localStorage.setItem('userId', data.user.id_utilisateur);
                    window.location.href = '/index.html';
                } else {
                    document.getElementById('loginError').textContent = data.message;
                }
            } catch (error) {
                document.getElementById('loginError').textContent = 'Error during login';
            }
        }

        async function register() {
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            
            try {
                const response = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nom: name,
                        email,
                        mot_de_passe: password,
                        photo_de_profil: 'default.jpg'
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('registerError').textContent = 'Registration successful! Please check your email to validate your account.';
                    setTimeout(() => toggleForm(), 2000);
                } else {
                    document.getElementById('registerError').textContent = data.message;
                }
            } catch (error) {
                document.getElementById('registerError').textContent = 'Error during registration';
            }
        }
    </script>
</body>
</html>
